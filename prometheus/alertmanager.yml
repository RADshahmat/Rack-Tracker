global:
  resolve_timeout: 5m

route:
  group_by:
    - alertname
    - service
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 1h
  receiver: webhook-logger

  # Route critical alerts separately
  routes:
    - match:
        severity: critical
      receiver: webhook-logger
      group_wait: 5s        # fire faster for critical

receivers:
  - name: webhook-logger
    webhook_configs:
      - url: http://backend:3000/api/alerts/webhook
        send_resolved: true
        http_config:
          follow_redirects: true
        max_alerts: 10

inhibit_rules:
  # If backend is down suppress all other alerts from it
  - source_match:
      alertname: BackendDown
    target_match:
      service: rack-tracker
    equal:
      - service