global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Load alert rules
rule_files:
  - /etc/prometheus/alerts.yml

# AlertManager connection
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # Scrape Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # Scrape our backend /metrics
  - job_name: rack-tracker-backend
    static_configs:
      - targets:
          - backend:3000
    metrics_path: /metrics
    scrape_interval: 15s

  # Scrape node exporter (host metrics)
  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100