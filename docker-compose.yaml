version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rack-tracker-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rackuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rackpass}
      POSTGRES_DB: ${POSTGRES_DB:-racktracker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - ./database/03-users.sql:/docker-entrypoint-initdb.d/03-users.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-rackuser} -d $${POSTGRES_DB:-racktracker}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rack-network

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile.dev
    container_name: rack-tracker-backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://rackuser:rackpass@postgres:5432/racktracker}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-rack-tracker@rack.local}
      SMTP_TO: ${SMTP_TO:-admin@rack.local}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      CHOKIDAR_USEPOLLING: "true"
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtsecretchangethisinproduction}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      PROMETHEUS_CONFIG_PATH: ${PROMETHEUS_CONFIG_PATH:-/etc/prometheus/prometheus.yml}
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads 
      - ./prometheus:/etc/prometheus/
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rack-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rack-tracker-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - rack-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: rack-tracker-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'          # enables POST /-/reload
      - '--web.enable-admin-api'
    depends_on:
      - backend
    networks:
      - rack-network
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: rack-tracker-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    depends_on:
      - backend
    networks:
      - rack-network
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: rack-tracker-node-exporter
    ports:
      - "9100:9100"
    command:
      - '--path.rootfs=/host'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    networks:
      - rack-network
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog
    container_name: rack-tracker-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - rack-network

  grafana:
      image: grafana/grafana:latest
      container_name: rack-tracker-grafana
      ports:
        - "3001:3000"
      environment:
        GF_SECURITY_ADMIN_USER: admin
        GF_SECURITY_ADMIN_PASSWORD: admin
        GF_USERS_ALLOW_SIGN_UP: false
      volumes:
        - grafana_data:/var/lib/grafana
        - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
        - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      depends_on:
        - prometheus
      networks:
        - rack-network
      restart: unless-stopped


volumes:
  postgres_data:
  uploads:
  prometheus_data:
  alertmanager_data:
  grafana_data:

networks:
  rack-network:
    driver: bridge